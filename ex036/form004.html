<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Novos inputs</h1>

    <form action="cadastro.php" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Sei lá</legend>
            <label for="icor">Selecione uma cor</label>
            <input type="color" name="cor" id="icor">
            <label for="inivel">Selecione um nível de satisfação</label>
            <input type="range" name="nivel" id="inivel" min="1" max="5">
            <label for="iarquivo">Faça o upload de um arquivo</label>
            <input type="file" name="arquivo" id="iarquivo" multiple accept=".jpg, .png">
        </fieldset>
        <input type="submit" value="confirmar">
    </form>
    
</body>
</html>
