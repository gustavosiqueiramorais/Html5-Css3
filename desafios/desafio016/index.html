<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Praticando iframes</title>
</head>
<body>
    <main>
        <div class="conteudo">
            <section id="telefone">
                <iframe src="" frameborder="0"></iframe>
            </section>
            <section id="redes-sociais">
                <button>
                    <img src="imagens/github-logo.png" alt="github logo">
                </button>
                <button>
                    <img src="imagens/instagram-logo.png" alt="instagram logo">
                </button>
                <button>
                    <img src="imagens/linkedin-logo.png" alt="linkedin logo">
                </button>
                <button>
                    <img src="imagens/home-icon-silhouette.png" alt="home logo">
                </button>
            </section>
        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
